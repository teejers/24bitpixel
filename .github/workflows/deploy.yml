# Builds the frontend and copies it to the DreamHost account that serves
# each site: 24bitpixel.com (mainnet) and test.24bitpixel.com (Sepolia).
# Runs on every push to master, on a schedule (to refresh the history
# snapshot baked into the build — see frontend/scripts/snapshot-history.ts),
# and by hand from the Actions tab (Run workflow).
#
# Repository secrets it reads (Settings > Secrets and variables > Actions):
#   VITE_WALLETCONNECT_ID  WalletConnect/Reown project id (public, but a secret keeps it out of the repo)
#   VITE_RPC_URL           optional; your own RPC endpoint(s), comma-separated, tried before the public ones
#   DEPLOY_HOST            DreamHost server, e.g. vps12345.dreamhostps.com
#   DEPLOY_SSH_KEY         private half of a key pair whose public half is on both DreamHost users
#   DEPLOY_KNOWN_HOSTS     optional; the server's host key. Without it the key is trusted on first sight.
#   DEPLOY_USER            shell user that owns 24bitpixel.com
#   DEPLOY_PATH            its web directory, e.g. /home/<user>/24bitpixel.com/
#   DEPLOY_USER_STAGING    shell user that owns test.24bitpixel.com
#   DEPLOY_PATH_STAGING    its web directory
#
# The build runs whether or not those are set, so this doubles as a check on
# every push; a site's upload is skipped until its secrets exist.

name: Build and deploy

on:
  push:
    branches: [master]
  schedule:
    # Every 6 hours: rebuild so the baked-in history snapshot stays fresh.
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    name: ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: production
            chain: mainnet
            build: build:production
            user_secret: DEPLOY_USER
            path_secret: DEPLOY_PATH
          - site: staging
            chain: sepolia
            build: build:staging
            user_secret: DEPLOY_USER_STAGING
            path_secret: DEPLOY_PATH_STAGING
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Also refreshes src/data/history.<chain>.json from the chain first;
      # if no RPC will serve it, the committed snapshot is used as-is.
      - name: Build
        run: npm run ${{ matrix.build }}
        env:
          VITE_CHAIN: ${{ matrix.chain }}
          VITE_RPC_URL: ${{ secrets.VITE_RPC_URL }}
          VITE_WALLETCONNECT_ID: ${{ secrets.VITE_WALLETCONNECT_ID }}

      # A build with no wallet id still compiles but ships the placeholder
      # project id, which breaks WalletConnect — refuse to upload that.
      - name: Check deploy configuration
        id: cfg
        env:
          WALLETCONNECT_ID: ${{ secrets.VITE_WALLETCONNECT_ID }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets[matrix.user_secret] }}
          TARGET: ${{ secrets[matrix.path_secret] }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=
          for name in WALLETCONNECT_ID HOST USERNAME TARGET KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.site }} upload skipped — no value for:$missing. Set the matching repository secrets to turn deploys on."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to DreamHost
        if: steps.cfg.outputs.ready == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets[matrix.user_secret] }}
          DEPLOY_PATH: ${{ secrets[matrix.path_secret] }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          # No --delete: index.html and og.png are overwritten in place and
          # the hashed bundles are new files, so nothing on the server needs
          # removing, and a wrong DEPLOY_PATH can't erase anything.
          rsync -rlptz --checksum \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

      - name: Forget the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
